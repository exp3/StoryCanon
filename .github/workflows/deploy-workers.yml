name: deploy-workers

# The only deploy pipeline. It replaced deploy-main.yml, which shipped to AWS;
# that workflow and the CDK app it drove were removed once Fargate was
# decommissioned.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs the Node client's generator and tsc, which is what the app is type
      # checked against. The Worker build regenerates both variants itself.
      - name: Run unit tests
        run: npm run test -w apps/web

      - name: Run integration tests
        run: npm run test:integration

      # Schema first, then the code that depends on it — migrations have to stay
      # expand-only, because a Worker deploy is instant and has no bake period in
      # which to catch a mismatch.
      #
      # Supabase's direct endpoint is IPv6-only; this connection string uses the
      # session pooler so a GitHub runner can reach it. The Worker itself goes
      # through Hyperdrive to the direct endpoint.
      - name: Apply database migrations
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: npx prisma migrate deploy

      # Both client variants. The test step above only builds the Node one (via
      # its pretest hook), and esbuild resolves the `workerd` condition, so
      # without this the Worker build cannot find dist/workers/client.js — which
      # was the real cause of the first CI failure.
      - name: Build both database clients
        run: npm run db:all -w apps/web

      # Assert the files esbuild will look for exist, rather than discovering
      # they are missing several minutes later from inside a bundler.
      - name: Check both clients were built
        run: |
          set -euo pipefail
          test -f packages/db/dist/node/client.js
          test -f packages/db/dist/workers/client.js
          test -f packages/db/dist/workers/internal/query_compiler_fast_bg.wasm

      # Next writes a symlink for the workspace package into the standalone
      # output, and it does not survive being copied into .open-next — esbuild
      # reports "Could not resolve @storycanon/db" with no further detail.
      # Windows never sees this because `next build` cannot create that symlink
      # at all (EPERM) and resolution falls back to the repository's own
      # node_modules.
      #
      # Replacing the link with a real directory fixes that but moves the
      # package inside .open-next, where esbuild can no longer walk up to the
      # repository's node_modules for what it imports. So the copy carries its
      # own: the generated client needs exactly these two, and nothing else.
      - name: Materialise the workspace package
        run: |
          set -euo pipefail
          test -L node_modules/@storycanon/db
          rm node_modules/@storycanon/db
          cp -r packages/db node_modules/@storycanon/db
          mkdir -p node_modules/@storycanon/db/node_modules/@prisma
          cp -r node_modules/@prisma/client node_modules/@storycanon/db/node_modules/@prisma/client
          cp -r node_modules/@prisma/client-runtime-utils node_modules/@storycanon/db/node_modules/@prisma/client-runtime-utils
          test -f node_modules/@storycanon/db/node_modules/@prisma/client/runtime/wasm-compiler-edge.mjs

      # `deploy:worker` builds through scripts/build-worker.mjs, which moves the
      # dotenv files aside first. A runner has none, so it is a no-op here — the
      # script exists for local deploys, where `next build` would otherwise bake
      # a developer's localhost config and dev NEXTAUTH_SECRET into the bundle.
      - name: Build and deploy the Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:worker

      # The deploy replaces the Worker's vars wholesale from wrangler.jsonc, so
      # a file that lost PAYMENT_MODE would silently put production into mock
      # checkout. Fail the job rather than leave that to be noticed in revenue.
      - name: Verify the deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://storycanon.softglow.jp/api/health || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200" || { echo "health check failed: $code"; exit 1; }

          # /api/health never touches the database, so it cannot tell whether
          # Postgres is reachable. This path queries before it can answer 401.
          db=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer verify-deployment-not-a-real-token" \
            https://storycanon.softglow.jp/api/mcp/list-private-projects || true)
          test "$db" = "401" || { echo "database path returned $db, expected 401"; exit 1; }

          # The MCP endpoint validates Origin before it authenticates, and an
          # allowlist missing a connector's domain returns 403 here. That is
          # invisible from the outside — it reaches the client as a failed
          # connection — so it went unnoticed once already (issue #43).
          mcp=$(curl -s -o /dev/null -w "%{http_code}" -X POST             -H "Origin: https://claude.ai"             -H "Content-Type: application/json"             -H "Accept: application/json, text/event-stream"             -H "Authorization: Bearer verify-deployment-not-a-real-token"             -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'             https://storycanon.softglow.jp/mcp || true)
          test "$mcp" = "401" || { echo "MCP origin check returned $mcp, expected 401"; exit 1; }

          echo "health 200, database reachable, MCP origin accepted"
